name: check-credentials

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
      YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
      YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
      YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      YT3_CLIENT_ID: ${{ secrets.YT3_CLIENT_ID }}
      YT3_CLIENT_SECRET: ${{ secrets.YT3_CLIENT_SECRET }}
      YT3_REFRESH_TOKEN: ${{ secrets.YT3_REFRESH_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-light.txt}
      - run: pip install -r requirements-light.txt
      - run: python -m mysterystudio check
